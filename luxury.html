<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DAQQA PRIVÉ | لاكشري — ساعات فاخرة</title>

<meta name="keywords" content="ساعات فاخرة, ساعات لاكشري, luxury watches Egypt, DAQQA PRIVÉ, DAQQA Luxury, ساعات رجالي فاخرة, ساعات حريمي فاخرة">
<meta name="robots" content="index, follow, max-image-preview:large">

<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css?v=20261018d">
<link rel="stylesheet" href="assets/store.css?v=20261018d">
<style>
/* DAQQA PRIVÉ — the luxury room: near-black, champagne gold, slow light */
:root{--lx-bg:#0A0806;--lx-bg2:#120D08;--lx-gold:#C9A96E;--lx-gold-2:#E9D3A3;--lx-gold-3:#8C6A3A;--lx-ink:#F2E9D8;--lx-mute:#A39479;--lx-line:rgba(201,169,110,.22);
  --bg:#0A0806;--nav:#0E0A07;--hero:#120D08;--line:rgba(201,169,110,.22);--accent:#C9A96E;--accent-rgb:201 169 110;--bg-rgb:10 8 6;--ink:#F2E9D8;--muted:#A39479}
body{background:var(--lx-bg);color:var(--lx-ink)}
#themeBtn{display:none}
.nav-bar{background:rgba(10,8,6,.82)!important;backdrop-filter:blur(14px);border-bottom-color:var(--lx-line)!important}
.gold{background:linear-gradient(100deg,var(--lx-gold-3) 0%,var(--lx-gold-2) 28%,var(--lx-gold) 52%,var(--lx-gold-2) 76%,var(--lx-gold-3) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 9s linear infinite}
@keyframes sheen{to{background-position:-220% 0}}
.lx-cap{font:600 10px var(--f-ui);letter-spacing:.5em;color:var(--lx-gold);text-transform:uppercase}

/* hero */
.lx-hero{position:relative;min-height:calc(100vh - 77px);display:grid;place-items:center;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 60% 55% at 50% 48%,#2a1d10 0%,#140e08 45%,var(--lx-bg) 75%)}
.lx-frame{position:absolute;inset:26px;border:1px solid var(--lx-line);pointer-events:none;z-index:2}
.lx-frame i{position:absolute;width:22px;height:22px;border-color:var(--lx-gold);border-style:solid;border-width:0}
.lx-frame i:nth-child(1){top:-1px;left:-1px;border-top-width:1px;border-left-width:1px}
.lx-frame i:nth-child(2){top:-1px;right:-1px;border-top-width:1px;border-right-width:1px}
.lx-frame i:nth-child(3){bottom:-1px;left:-1px;border-bottom-width:1px;border-left-width:1px}
.lx-frame i:nth-child(4){bottom:-1px;right:-1px;border-bottom-width:1px;border-right-width:1px}
.lx-word{position:absolute;inset:0;display:grid;place-items:center;z-index:-1;font:italic 400 clamp(110px,21vw,330px)/1 var(--f-display);letter-spacing:.04em;color:transparent;-webkit-text-stroke:1px rgba(201,169,110,.28);direction:ltr;user-select:none;pointer-events:none}
.lx-top{position:absolute;top:60px;left:0;right:0;display:flex;justify-content:center;gap:18px;align-items:center;direction:ltr}
.lx-top span{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--lx-gold))}
.lx-top span:last-child{transform:scaleX(-1)}
.lx-center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding:120px 20px 150px}
.lx-dial{position:relative;width:min(46vh,420px);aspect-ratio:1;display:grid;place-items:center}
.lx-dial svg{position:absolute;inset:0;width:100%;height:100%;animation:turn 120s linear infinite}
.lx-dial .glow{position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle,rgba(233,211,163,.22),transparent 65%);filter:blur(10px)}
.lx-dial .pic{position:relative;width:72%;aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px rgba(201,169,110,.55),0 0 0 10px rgba(10,8,6,.9),0 0 0 11px rgba(201,169,110,.25),0 60px 120px -30px rgba(0,0,0,.9)}
.lx-dial .pic img{width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform 2s cubic-bezier(.2,.7,.2,1),opacity .18s,filter .18s}
.lx-dial:hover .pic img{transform:scale(1.12)}
@keyframes turn{to{transform:rotate(360deg)}}
.lx-hero h1{font:400 clamp(46px,6.4vw,96px)/1 var(--f-display);letter-spacing:.14em;direction:ltr}
.lx-hero h1 em{font-style:italic;letter-spacing:.04em}
.lx-hero .ar{font:400 clamp(24px,2.6vw,34px) 'Amiri',var(--f-ar);color:var(--lx-ink);opacity:.9}
.lx-hero .meta{display:flex;gap:28px;font:600 10px var(--f-ui);letter-spacing:.4em;color:var(--lx-mute);direction:ltr;margin-top:6px}
.lx-hero .meta b{color:var(--lx-gold);font-weight:600}
.lx-scroll{position:absolute;bottom:52px;left:0;right:0;margin:auto;width:max-content;display:flex;flex-direction:column;align-items:center;gap:10px;font:600 9px var(--f-ui);letter-spacing:.5em;color:var(--lx-mute)}
.lx-scroll i{width:1px;height:46px;background:linear-gradient(var(--lx-gold),transparent);animation:drip 2.2s ease-in-out infinite;transform-origin:top}
@keyframes drip{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

/* marquee */
.lx-marq{border-block:1px solid var(--lx-line);overflow:hidden;padding:18px 0;background:var(--lx-bg2)}
.lx-marq div{display:flex;gap:46px;width:max-content;animation:marq 38s linear infinite;font:italic 400 22px var(--f-display);color:var(--lx-gold);direction:ltr;white-space:nowrap}
.lx-marq span{display:inline-flex;align-items:center;gap:46px}
.lx-marq span::after{content:"✦";font-style:normal;font-size:12px;color:var(--lx-gold-3)}
@keyframes marq{to{transform:translateX(-50%)}}

/* filters */
.lx-filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:70px 20px 10px}
.lx-filters button{height:42px;padding:0 22px;border-radius:999px;border:1px solid var(--lx-line);color:var(--lx-mute);font-size:14px;font-weight:600;transition:all .3s}
.lx-filters button:hover{color:var(--lx-ink);border-color:var(--lx-gold)}
.lx-filters button.on{background:linear-gradient(120deg,var(--lx-gold-3),var(--lx-gold));color:#140E08;border-color:transparent}

/* chapters */
.lx-ch{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,110px);align-items:center;padding:110px 0;border-bottom:1px solid var(--lx-line)}
.lx-ch:last-child{border-bottom:0}
.lx-ch.flip .lx-pic{order:2}
.lx-ch .num{position:absolute;top:60px;font:italic 400 clamp(120px,16vw,240px)/1 var(--f-display);color:transparent;-webkit-text-stroke:1px rgba(201,169,110,.16);pointer-events:none;direction:ltr}
.lx-ch:not(.flip) .num{left:-1%}.lx-ch.flip .num{right:-1%}
.lx-pic{position:relative;isolation:isolate}
.lx-pic::before{content:"";position:absolute;inset:-18px 18px 18px -18px;border:1px solid var(--lx-line);z-index:-1;transition:inset .8s cubic-bezier(.2,.7,.2,1)}
.lx-ch.flip .lx-pic::before{inset:-18px -18px 18px 18px}
.lx-pic:hover::before{inset:-26px 26px 26px -26px}
.lx-ch.flip .lx-pic:hover::before{inset:-26px -26px 26px 26px}
.lx-pic .ph{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;background:#140E08}
.lx-pic .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.6s cubic-bezier(.2,.7,.2,1),opacity .18s,filter .18s}
.lx-pic .ph img.swap{opacity:.15;filter:blur(3px)}
.lx-pic:hover .ph img{transform:scale(1.06)}
.lx-pic .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(10,8,6,.55));pointer-events:none}
.lx-pic .ph-dots{top:auto;bottom:18px}
.lx-pic:hover .ph-dots,.flipping .ph-dots{opacity:1}
.lx-pic .tag{position:absolute;top:18px;right:18px;z-index:2;font:600 9px var(--f-ui);letter-spacing:.4em;color:#140E08;background:linear-gradient(120deg,var(--lx-gold-2),var(--lx-gold));padding:8px 12px 8px 14px}
.lx-txt{position:relative;display:flex;flex-direction:column;gap:16px}
.lx-txt .kind{direction:ltr;text-align:right}
.lx-txt h2{font:400 clamp(36px,4vw,60px)/1.05 var(--f-display);color:var(--lx-ink);direction:ltr;text-align:right}
.lx-txt h2 a:hover{color:var(--lx-gold-2)}
.lx-txt .lead{font:400 21px/1.7 'Amiri',var(--f-ar);color:var(--lx-mute);max-width:460px}
.lx-specs{display:grid;gap:0;max-width:460px;margin-top:4px}
.lx-specs div{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--lx-line);font-size:14px}
.lx-specs span{color:var(--lx-mute)}
.lx-specs i{flex:1;border-bottom:1px dotted rgba(201,169,110,.3);transform:translateY(-4px)}
.lx-specs b{font-weight:600;color:var(--lx-ink)}
.lx-price{display:flex;align-items:baseline;gap:14px;margin-top:8px;font-family:var(--f-ui)}
.lx-price .now{font:500 34px var(--f-display)}
.lx-price s{color:var(--lx-mute);font-size:15px}
.lx-price .off{font:700 11px var(--f-ui);letter-spacing:.1em;color:#140E08;background:var(--lx-gold);padding:4px 10px;border-radius:999px}
.lx-sw{display:flex;gap:10px}
.lx-sw i{width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 2px var(--lx-bg),0 0 0 3px rgba(201,169,110,.6)}
.lx-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.lx-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 30px;font-weight:700;font-size:15px;letter-spacing:.02em;transition:all .35s;position:relative;overflow:hidden}
.lx-btn svg{width:18px;height:18px}
.lx-btn.solid{background:linear-gradient(120deg,var(--lx-gold-3),var(--lx-gold) 45%,var(--lx-gold-2));color:#140E08}
.lx-btn.solid:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 20px 40px -18px rgba(201,169,110,.6)}
.lx-btn.line{border:1px solid var(--lx-line);color:var(--lx-ink)}
.lx-btn.line:hover{border-color:var(--lx-gold);color:var(--lx-gold-2)}
.lx-btn.ico{width:54px;padding:0}
.lx-btn.ico.on{color:var(--lx-gold)}
.lx-out{color:var(--lx-mute);font-size:14px}

/* concierge */
.lx-cta{position:relative;text-align:center;padding:120px 20px;background:radial-gradient(ellipse at 50% 0%,#2a1d10,var(--lx-bg) 70%);border-top:1px solid var(--lx-line)}
.lx-cta h3{font:400 clamp(34px,4.6vw,64px)/1.1 var(--f-display);direction:ltr}
.lx-cta p{font:400 22px 'Amiri',var(--f-ar);color:var(--lx-mute);margin:14px auto 30px;max-width:520px}
.site-foot{background:var(--lx-bg)!important}

/* cursor ring in gold here */
.cursor-ring{border-color:var(--lx-gold)!important}
@media (max-width:900px){
  .lx-hero{min-height:auto}.lx-frame{inset:12px}.lx-top{top:30px}
  .lx-center{padding:90px 16px 120px}.lx-dial{width:min(78vw,340px)}
  .lx-ch,.lx-ch.flip{grid-template-columns:1fr;padding:70px 0;gap:44px}.lx-ch.flip .lx-pic{order:0}
  .lx-top{letter-spacing:.3em;font-size:8px;white-space:nowrap}.lx-top span{width:28px}
  .lx-scroll{display:none}.lx-hero .meta{flex-wrap:wrap;justify-content:center;gap:8px 18px}
  .lx-ch .num{top:20px}.lx-pic{margin:0 18px}
  .lx-acts .lx-btn.solid{flex:1}
}
@media (prefers-reduced-motion:reduce){.gold,.lx-dial svg,.lx-marq div,.lx-scroll i{animation:none}}
</style>
</head>
<body>
<div id="hdr"></div>
<main id="page"><section class="lx-hero"><div class="lx-center"><div class="skeleton" style="width:320px;height:320px;border-radius:50%;opacity:.3"></div></div></section></main>
<div id="ftr"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js?v=20261018d"></script>
<script src="assets/app.js?v=20261018d"></script>
<script>
const { esc, money, finalPrice, discountPct } = RC;
const ORDER = Object.keys(RC.kinds); // watches first
const ticks = () => { let s = ''; for (let i = 0; i < 60; i++) { const a = i * 6 * Math.PI / 180, big = i % 5 === 0, r1 = big ? 41 : 44, r2 = 47.5; s += `<line x1="${50 + r1 * Math.sin(a)}" y1="${50 - r1 * Math.cos(a)}" x2="${50 + r2 * Math.sin(a)}" y2="${50 - r2 * Math.cos(a)}" stroke="${big ? '#E9D3A3' : '#8C6A3A'}" stroke-width="${big ? .6 : .3}"/>`; } return s; };
let filter = 'all';
DQ.start('luxury', () => {
  const all = DQ.pageItems('luxury').sort((a, b) => (ORDER.indexOf(RC.kindOf(a)) - ORDER.indexOf(RC.kindOf(b))) || (b.featured - a.featured) || (finalPrice(b) - finalPrice(a)));
  // no luxury pieces with photos → the page doesn't exist
  if (!all.length && !DQ.loadError) return location.replace('./');
  const hero = all.find(p => RC.kindOf(p) === 'watches') || all[0];
  const kinds = ORDER.filter(k => all.some(p => RC.kindOf(p) === k));
  const gens = [['men', 'رجالي'], ['women', 'حريمي']].filter(([g]) => all.some(p => p.category === g));
  const lead = p => { const d = RC.splitDesc ? RC.splitDesc(p.description || '') : { text: p.description || '', specs: [] }; return d; };
  const chapter = (p, i) => {
    const d = lead(p), off = discountPct(p), url = RC.productUrl(p), n = (p.images || []).length, fav = DQ.favs.has(p.id);
    const specs = (d.specs || []).slice(0, 4), text = String(d.body || '').split(/\n/)[0];
    return `<article class="lx-ch ${i % 2 ? 'flip' : ''}" data-pid="${p.id}">
      <div class="num" aria-hidden="true">${String(i + 1).padStart(2, '0')}</div>
      <div class="lx-pic op op-curtain"><a class="ph" href="${url}" aria-label="${esc(p.name)}"><img src="${DQ.img(p)}" alt="${esc(p.name)}" loading="${i ? 'lazy' : 'eager'}">${n > 1 ? `<span class="ph-dots" aria-hidden="true">${'<i></i>'.repeat(Math.min(n, 6))}</span>` : ''}</a>${p.featured ? '<span class="tag en">SIGNATURE</span>' : ''}</div>
      <div class="lx-txt op op-stagger">
        <span class="lx-cap kind">N° ${String(i + 1).padStart(2, '0')} · ${RC.kinds[RC.kindOf(p)].en}${p.style ? ' · ' + esc(p.style) : ''}</span>
        <h2 class="en"><a href="${url}">${esc(p.name)}</a></h2>
        ${text ? `<p class="lead">${esc(text)}</p>` : ''}
        ${specs.length ? `<div class="lx-specs">${specs.map(([k, v]) => `<div><span>${esc(k)}</span><i></i><b>${esc(v)}</b></div>`).join('')}</div>` : ''}
        ${RC.colors(p).length ? `<div class="lx-sw">${RC.colors(p).map(c => `<i style="background:${c}" title="${c.toUpperCase()}"></i>`).join('')}</div>` : ''}
        <div class="lx-price"><span class="now gold">${money(finalPrice(p))}</span>${off ? `<s>${money(p.price)}</s><span class="off en">-${off}%</span>` : ''}</div>
        <div class="lx-acts">${p.stock > 0 ? `<button class="lx-btn solid" data-add="${p.id}">أضف للسلة ${DQ.ICON.bag}</button>` : `<span class="lx-out">نفدت الكمية — اسألنا على واتساب</span>`}<a class="lx-btn line" href="${url}">التفاصيل</a><button class="lx-btn line ico ${fav ? 'on' : ''}" data-fav="${p.id}" aria-label="المفضلة" aria-pressed="${fav}">${DQ.ICON.heart}</button></div>
      </div></article>`;
  };
  document.getElementById('page').innerHTML = `
  <section class="lx-hero" data-glow>
    <div class="lx-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="lx-word" aria-hidden="true">Luxury</div>
    <div class="lx-top lx-cap"><span></span>DAQQA · PRIVÉ COLLECTION<span></span></div>
    <div class="lx-center">
      <a class="lx-dial" href="${RC.productUrl(hero)}" data-pid="${hero.id}" aria-label="${esc(hero.name)}">
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48.5" fill="none" stroke="#C9A96E" stroke-width=".25"/>${ticks()}</svg>
        <span class="glow"></span><span class="pic ph"><img src="${DQ.img(hero)}" alt=""></span>
      </a>
      <h1 class="gold">DAQQA <em>Privé</em></h1>
      <div class="ar">الفخامة في كل دقّة.</div>
      <div class="meta"><span><b>${all.length}</b> PIECES</span><span>${kinds.map(k => RC.kinds[k].en.toUpperCase()).join(' · ')}</span></div>
    </div>
    <div class="lx-scroll en">SCROLL<i></i></div>
  </section>
  <div class="lx-marq" aria-hidden="true"><div>${('<span>DAQQA Privé</span><span>Luxury</span><span>لاكشري</span><span>' + kinds.map(k => RC.kinds[k].en).join('</span><span>') + '</span>').repeat(6)}</div></div>
  ${(kinds.length > 1 || gens.length > 1) ? `<div class="lx-filters" role="tablist"><button data-f="all" class="on">الكل</button>${kinds.length > 1 ? kinds.map(k => `<button data-f="k:${k}">${RC.kinds[k].ar}</button>`).join('') : ''}${gens.length > 1 ? gens.map(([g, l]) => `<button data-f="g:${g}">${l}</button>`).join('') : ''}</div>` : ''}
  <section class="wrap" id="chapters"></section>
  <section class="lx-cta op op-stagger">
    <span class="lx-cap">PRIVATE SERVICE</span>
    <h3 class="gold">Reserved for You.</h3>
    <p>عاوز قطعة معينة أو تشوف صور أكتر قبل ما تطلب؟ كلمنا مباشرة.</p>
    ${DQ.wa() ? `<a class="lx-btn solid" href="https://wa.me/${DQ.wa()}?text=${encodeURIComponent('أهلاً، مهتم بمجموعة DAQQA Privé')}" target="_blank" rel="noopener">كلمنا على واتساب</a>` : `<a class="lx-btn solid" href="./">تسوّق كل المجموعات</a>`}
  </section>`;
  const draw = () => {
    const list = all.filter(p => filter === 'all' || (filter.startsWith('k:') ? RC.kindOf(p) === filter.slice(2) : (p.category === filter.slice(2) || p.category === 'unisex')));
    document.getElementById('chapters').innerHTML = list.map(chapter).join('');
    DQ.reveal();
  };
  const f = document.querySelector('.lx-filters');
  if (f) f.onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; f.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
  draw();
  DQ.onRefresh = () => {};
});
</script>
</body>
</html>
