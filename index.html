<style>
/* section banner (dark) */
.banner{position:relative;min-height:560px;display:flex;align-items:center;overflow:hidden;background:var(--hero);border-bottom:1px solid var(--line)}
.banner .bg{position:absolute;inset:0;background:var(--hero) var(--img) no-repeat;background-size:cover;background-position:left center}
.banner .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,var(--hero) 0%,rgba(43,27,13,.92) 34%,rgba(43,27,13,.25) 70%,rgba(43,27,13,.1) 100%),linear-gradient(0deg,rgba(24,17,10,.6),transparent 40%)}
.banner .wrap{position:relative;width:100%}
.banner .txt{max-width:520px;padding:90px 0}
.mini-brand{display:inline-flex;flex-direction:column;line-height:1.05;direction:ltr;text-align:left;margin-bottom:34px}
.mini-brand b{font:500 26px var(--f-display);letter-spacing:.24em;color:var(--ink)}
.mini-brand small{font:600 9px var(--f-ui);letter-spacing:.62em;color:var(--accent);margin-top:4px;padding-left:.2em}
.banner h2{font:400 clamp(44px,6vw,80px)/1.02 var(--f-display);color:var(--ink);letter-spacing:-.01em}
.banner .ar{font:700 clamp(22px,2.4vw,30px)/1.5 'Amiri',var(--f-ar);color:var(--accent);margin-top:16px}
.banner p{color:var(--muted);margin:8px 0 28px;max-width:420px}
.btn-line{display:inline-flex;align-items:center;gap:12px;height:50px;padding:0 24px;border:1px solid var(--ink);border-radius:4px;color:var(--ink);font-weight:600;transition:background .25s,color .25s,border-color .25s}
.btn-line svg{width:18px;height:18px}
.btn-line:hover{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.section-first .banner{min-height:640px}
/* banner without a section photo: text + framed product */
.banner.framed{background:radial-gradient(ellipse at 22% 50%,rgba(208,180,140,.12),transparent 55%),var(--hero)}
.bn-grid{display:grid;grid-template-columns:1fr minmax(0,440px);gap:56px;align-items:center}
.frame{position:relative;display:block;aspect-ratio:4/5;border-radius:220px 220px 18px 18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 40px 80px -30px rgba(0,0,0,.7)}
.frame img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.frame:hover img{transform:scale(1.05)}
.frame span{position:absolute;inset:auto 0 0 0;padding:40px 18px 16px;background:linear-gradient(0deg,rgba(24,17,10,.85),transparent);font:500 15px var(--f-display);color:var(--ink);text-align:center}
.band.plain{min-height:380px;background:radial-gradient(ellipse at 80% 20%,rgba(208,180,140,.08),transparent 50%),var(--bg)}
.band .wm{position:absolute;left:4%;top:50%;transform:translateY(-55%);width:min(420px,46vw);aspect-ratio:184/190;opacity:.07;pointer-events:none}
/* product strip (cream) */
.strip-in{padding-top:56px;padding-bottom:64px}
.strip-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}
.strip-head h3{font:400 clamp(30px,3.4vw,42px)/1.1 var(--f-display);color:var(--bg)}
.strip-head h3 small{font:600 15px var(--f-ar);color:var(--btn);margin-inline-start:12px}
.view-all{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--bg);white-space:nowrap}
.view-all svg{width:16px;height:16px}
.view-all:hover{color:var(--btn)}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--s-line);margin-bottom:28px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{height:46px;font-size:14px;color:var(--s-muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .2s,border-color .2s}
.tabs button:hover{color:var(--bg)}
.tabs button.on{color:var(--bg);border-color:var(--bg);font-weight:600}
.strip .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.strip .grid.clip>.card:nth-child(n+5){display:none}
.strip .empty{color:var(--s-muted)}
/* lifestyle band (dark) */
.band{position:relative;min-height:460px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:var(--bg)}
.band .bg{position:absolute;inset:0;background:var(--bg) var(--img) no-repeat;background-size:cover;background-position:center 30%;filter:saturate(.85)}
.band .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 8%,rgba(24,17,10,.55) 55%,rgba(24,17,10,.25)),linear-gradient(270deg,rgba(24,17,10,.75),transparent 60%)}
.band .wrap{position:relative;width:100%}
.band .lbl{font:500 14px var(--f-display);letter-spacing:.3em;color:var(--accent)}
.band h2{font:400 clamp(36px,4.6vw,60px)/1.05 var(--f-display);color:var(--ink);margin-top:12px}
.band .ar{font:700 22px 'Amiri',var(--f-ar);color:var(--muted);margin-top:8px}
.feats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:40px;border-top:1px solid rgba(208,180,140,.22)}
.feats div{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 10px 34px;text-align:center;font-size:13px;color:var(--muted);border-inline-start:1px solid rgba(208,180,140,.22)}
.feats div:first-child{border-inline-start:0}
.feats svg{width:34px;height:34px;color:var(--ink)}
.kind{scroll-margin-top:76px}
.kind+.kind{border-top:1px solid var(--line)}
.none{padding:140px 0;text-align:center;color:var(--muted)}
.none .m{width:90px;height:93px;margin:0 auto 18px;opacity:.6}
@media (max-width:1000px){
  .bn-grid{grid-template-columns:1fr minmax(0,340px);gap:32px}
  .strip .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .strip .grid.clip>.card:nth-child(n+4){display:none}
}
@media (max-width:760px){
  .banner,.section-first .banner{min-height:auto;flex-direction:column;align-items:stretch}
  .banner .bg{position:relative;inset:auto;height:320px;flex:none}
  .banner .bg::after{background:linear-gradient(0deg,var(--hero) 2%,rgba(43,27,13,0) 55%)}
  .banner .txt{padding:0 0 44px;max-width:none;margin-top:-30px}
  .banner.framed .txt{margin-top:0;padding:36px 0 8px}
  .bn-grid{grid-template-columns:1fr;gap:0}
  .frame{max-width:320px;margin:0 auto 44px;width:100%}
  .band.plain{min-height:auto;padding-top:56px}
  .mini-brand{margin-bottom:16px}
  .strip .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .strip .grid.clip>.card:nth-child(4){display:flex}
  .band{min-height:440px}
  .feats{grid-template-columns:repeat(2,1fr)}
  .feats div:nth-child(3){border-inline-start:0}
  .feats div:nth-child(n+3){border-top:1px solid rgba(208,180,140,.22)}
  .strip-in{padding-top:40px;padding-bottom:48px}
}

<body>
<div id="hdr"></div>
<main id="sections"><div class="none"><div class="m skeleton" style="border-radius:50%"></div>جاري التحميل…</div></main>
<div id="ftr"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js?v=20261017b"></script>
<script src="assets/app.js?v=20261017b"></script>
<script>
const { discountPct, esc } = RC;
const $ = s => document.querySelector(s);
const state = {}; // per section: { tab, all }

// section photos come from Admin → Settings (banners); without them the banner frames a product photo
function pick(k, list) {
  const set = (DQ.settings.banners || {})[k] || {};
  const ph = list.filter(p => p.images && p.images.length).sort((a, b) => (b.featured - a.featured) || (a.sort - b.sort));
  return { hero: set.hero || '', life: set.life || '', product: ph[0] };
}
function itemsFor(k) {
  const st = state[k];
  let list = DQ.products.filter(p => RC.kindOf(p) === k).sort((a, b) => (b.featured - a.featured) || (a.sort - b.sort));
  if (st.tab === '__sale') list = list.filter(p => discountPct(p) > 0);
  else if (st.tab !== 'all') list = list.filter(p => (p.style || '') === st.tab);
  return list;
}
function renderStrip(k) {
  const st = state[k], list = itemsFor(k), grid = document.querySelector(`#${k} .grid`);
  grid.classList.toggle('clip', !st.all);
  grid.innerHTML = list.length ? list.map(DQ.card).join('') : `<div class="empty">مفيش منتجات هنا.</div>`;
  document.querySelectorAll(`#${k} .tabs button`).forEach(b => b.classList.toggle('on', b.dataset.tab === st.tab));
  const va = document.querySelector(`#${k} .view-all`);
  va.hidden = list.length <= 4;
  va.querySelector('span').textContent = st.all ? 'عرض أقل' : `عرض الكل (${list.length})`;
  DQ.renderFavs(); DQ.reveal();
}
function build() {
  const live = DQ.liveKinds();
  if (!live.length) { $('#sections').innerHTML = `<div class="none"><div class="m">${RC.logo()}</div>${DQ.loadError ? 'حصلت مشكلة في التحميل. جرّب تعمل ريفريش.' : 'المنتجات جاية قريب.'}</div>`; return; }
  $('#sections').innerHTML = live.map((k, i) => {
    const K = RC.kinds[k], all = DQ.products.filter(p => RC.kindOf(p) === k), img = pick(k, all);
    const rank = s => { const i = K.styles.indexOf(s); return i < 0 ? 99 : i; };
    const styles = [...new Set(all.map(p => p.style).filter(Boolean))].sort((a, b) => rank(a) - rank(b));
    const sale = all.some(p => discountPct(p) > 0);
    state[k] = state[k] || { tab: 'all', all: false };
    return `<section class="kind ${i ? '' : 'section-first'}" id="${k}" aria-label="${K.ar}">
      <div class="banner ${img.hero ? 'has-photo' : 'framed'}">${img.hero ? `<div class="bg" style="--img:url('${esc(img.hero)}')"></div>` : ''}
        <div class="wrap ${img.hero ? '' : 'bn-grid'}"><div class="txt reveal">
          <div class="mini-brand"><b>DAQQA</b><small>ACCESSORIES</small></div>
          <h2 class="en" dir="ltr" style="text-align:right">${K.banner.en}</h2>
          <div class="ar">${K.banner.ar}</div>
          <p>${K.banner.sub}</p>
          <a class="btn-line" href="#${k}-shop">${K.banner.cta} ${DQ.ICON.arrow}</a>
        </div>${img.hero ? '' : `<a class="frame reveal" href="${RC.productUrl(img.product)}" aria-label="${esc(img.product.name)}"><img src="${esc(img.product.images[0])}" alt="${esc(img.product.name)}"><span class="en">${esc(img.product.name)}</span></a>`}</div></div>
      <div class="strip" id="${k}-shop"><div class="wrap strip-in">
        <div class="strip-head"><h3 class="en">${K.en}<small>${K.ar}</small></h3><button class="view-all" data-va="${k}"><span>عرض الكل</span> ${DQ.ICON.arrow}</button></div>
        <div class="tabs" role="tablist">
          <button data-tab="all" data-k="${k}" class="on">الكل</button>
          ${styles.map(s => `<button class="en" data-tab="${esc(s)}" data-k="${k}">${esc(s)}</button>`).join('')}
          ${sale ? `<button data-tab="__sale" data-k="${k}">العروض</button>` : ''}
        </div>
        <div class="grid clip"></div>
      </div></div>
      <div class="band ${img.life ? 'has-photo' : 'plain'}">${img.life ? `<div class="bg" style="--img:url('${esc(img.life)}')"></div>` : `<div class="wm" aria-hidden="true">${RC.logo()}</div>`}
        <div class="wrap"><div class="reveal"><div class="lbl en">DAQQA</div><h2 class="en" dir="ltr" style="text-align:right">${K.band.en}</h2><div class="ar">${K.band.ar}</div></div>
          <div class="feats">${K.band.feats.map(([ic, t]) => `<div>${DQ.ICON[ic]}<span>${t}</span></div>`).join('')}</div></div></div>
    </section>`;
  }).join('');
  live.forEach(renderStrip);
  const h = location.hash.slice(1);
  if (h && document.getElementById(h)) setTimeout(() => document.getElementById(h).scrollIntoView(), 60);
  // product list for Google
  const base = location.origin + location.pathname.replace(/index\.html$/, '');
  const ld = { '@context': 'https://schema.org', '@type': 'ItemList', name: 'DAQQA Collection', itemListElement: DQ.products.map((p, i) => ({ '@type': 'ListItem', position: i + 1, url: base + RC.productUrl(p), name: p.name })) };
  const s = document.createElement('script'); s.type = 'application/ld+json'; s.textContent = JSON.stringify(ld); document.head.appendChild(s);
}
document.addEventListener('click', e => {
  const t = e.target.closest('.tabs [data-tab]');
  if (t) { state[t.dataset.k].tab = t.dataset.tab; renderStrip(t.dataset.k); }
  const v = e.target.closest('[data-va]');
  if (v) { const k = v.dataset.va; state[k].all = !state[k].all; renderStrip(k); }
});
DQ.onRefresh = build;
DQ.start(RC.kinds[location.hash.slice(1)] ? location.hash.slice(1) : 'home', build);
</script>
