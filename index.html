/* ---------- desktop landing: scroll through the Q ---------- */
.landing{position:relative;z-index:5;overflow:clip;height:250vh;margin-bottom:-145vh;pointer-events:none}
.ld-stick{position:sticky;top:0;height:100vh;overflow:hidden;display:grid;place-items:center;background:var(--bg);pointer-events:auto}
.ld-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgb(var(--accent-rgb)/.16),transparent 55%),radial-gradient(circle at var(--mx,50%) var(--my,50%),rgb(var(--accent-rgb)/.14),transparent 30%)}
.ld-grid{position:absolute;inset:0;background-image:linear-gradient(rgb(var(--accent-rgb)/.05) 1px,transparent 1px),linear-gradient(90deg,rgb(var(--accent-rgb)/.05) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at center,#000 20%,transparent 70%)}

.bn-grid{display:grid;grid-template-columns:1fr minmax(0,440px);gap:56px;align-items:center}

.band .wm{position:absolute;left:4%;top:50%;transform:translateY(-55%);width:min(420px,46vw);aspect-ratio:184/190;opacity:.07;pointer-events:none}
/* product strip (cream) */

.strip .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.strip .grid.clip>.card:nth-child(n+5){display:none}
.strip .empty{color:var(--s-muted)}
/* lifestyle band (dark) */
.band{position:relative;min-height:460px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:var(--bg)}
.band .bg{position:absolute;inset:0;background:var(--bg) var(--img) no-repeat;background-size:cover;background-position:center 30%;filter:saturate(.85)}
.band .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 8%,rgb(var(--bg-rgb)/.55) 55%,rgb(var(--bg-rgb)/.25)),linear-gradient(270deg,rgb(var(--bg-rgb)/.75),transparent 60%)}
.band .wrap{position:relative;width:100%}
.band .lbl{font:500 14px var(--f-display);letter-spacing:.3em;color:var(--accent)}
.band h2{font:400 clamp(36px,4.6vw,60px)/1.05 var(--f-display);color:var(--ink);margin-top:12px}
.band .ar{font:700 22px 'Amiri',var(--f-ar);color:var(--muted);margin-top:8px}
.feats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:40px;border-top:1px solid rgb(var(--accent-rgb)/.22)}
.feats div{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 10px 34px;text-align:center;font-size:13px;color:var(--muted);border-inline-start:1px solid rgb(var(--accent-rgb)/.22)}
.feats div:first-child{border-inline-start:0}
.feats svg{width:34px;height:34px;color:var(--ink)}
.kind{scroll-margin-top:76px}
.kind+.kind{border-top:1px solid var(--line)}

.none .m{width:90px;height:93px;margin:0 auto 18px;opacity:.6}
@media (max-width:1000px){
  .bn-grid{grid-template-columns:1fr minmax(0,340px);gap:32px}

}

  .banner,.section-first .banner{min-height:auto;flex-direction:column;align-items:stretch}

  <div class="ld-scroll ld-fade"><span class="mouse"><i></i></span><b>اسكرول لتحت</b><small class="en">SCROLL</small></div>
  </div><div class="ld-ring" id="ldRing"></div></section>
<main id="sections"><div class="none"><div class="m skeleton" style="border-radius:50%"></div>جاري التحميل…</div></main>

<script>
const { discountPct, esc } = RC;
const $ = s => document.querySelector(s);
const state = {}; // per section: { tab, all }

// ---------- desktop landing: scroll-driven ----------
(function landing() {
  const L = document.getElementById('landing');
  const desktop = matchMedia('(min-width:901px) and (pointer:fine)').matches;
  if (!desktop) { L.remove(); return; }
  window.DQ_NO_INTRO = true;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dial = document.getElementById('ldDial'); dial.innerHTML = RC.dial();
  const letters = [...document.querySelectorAll('#ldWord span')], fades = [...L.querySelectorAll('.ld-fade')], stage = L.querySelector('.ld-stick'), ring = document.getElementById('ldRing');
  const hand = c => dial.querySelector('.' + c);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  let p = 0;
  function frame() {
    const d = new Date(), sec = d.getSeconds() + d.getMilliseconds() / 1000, min = d.getMinutes() + sec / 60, hr = (d.getHours() % 12) + min / 60;
    hand('dq-s').style.transform = `rotate(${sec * 6 + p * 1080}deg)`;
    hand('dq-m').style.transform = `rotate(${min * 6 + p * 540}deg)`;
    hand('dq-h').style.transform = `rotate(${hr * 30 + p * 90}deg)`;
    requestAnimationFrame(frame);
  }
  function onScroll() {
    const r = L.getBoundingClientRect(), span = L.offsetHeight - innerHeight;
    p = clamp(-r.top / span);
    if (reduce) return;
    const e = p * p;
    dial.style.transform = `scale(${1 + e * 16}) rotate(${p * 25}deg)`;
    dial.style.opacity = 1 - clamp((p - .78) / .2);
    letters.forEach((el, i) => { const off = (i - 2) * p * 260; el.style.transform = `translate(${off}px, ${p * 40}px) rotate(${(i - 2) * p * 14}deg)`; el.style.opacity = 1 - clamp(p / .45); el.style.animation = p > .01 ? 'none' : ''; });
    fades.forEach(el => { if (p > .01) el.style.animation = 'none'; el.style.opacity = 1 - clamp(p / .2); el.style.translate = `0 ${p * -60}px`; });
    // a window opens in the middle of the watch and the store shows through it
    const q = clamp((p - .66) / .34), R = (1 - (1 - q) ** 2.2) * 125;
    const m = R > 0 ? `radial-gradient(circle at 50% 46%, transparent ${R}vmax, #000 calc(${R}vmax + 1px))` : 'none';
    stage.style.webkitMaskImage = m; stage.style.maskImage = m;
    stage.style.pointerEvents = p > .85 ? 'none' : '';
    ring.style.width = ring.style.height = (R * 2) + 'vmax'; ring.style.opacity = R > 0 && R < 110 && p < 1 ? 1 : 0;
  }
  addEventListener('scroll', onScroll, { passive: true }); onScroll(); requestAnimationFrame(frame);
  L.addEventListener('pointermove', e => { L.style.setProperty('--mx', e.clientX / innerWidth * 100 + '%'); L.style.setProperty('--my', e.clientY / innerHeight * 100 + '%'); });
})();


// section photos come from Admin → Settings (banners); without them the banner frames a product photo
function pick(k, list) {
  const set = (DQ.settings.banners || {})[k] || {};
  const ph = list.filter(p => p.images && p.images.length).sort((a, b) => (b.featured - a.featured) || (a.sort - b.sort));
  return { hero: set.hero || '', life: set.life || '', product: ph[0] };
}
function itemsFor(k) {
  const st = state[k];
  let list = DQ.products.filter(p => RC.kindOf(p) === k).sort((a, b) => (b.featured - a.featured) || (a.sort - b.sort));
  if (st.tab === '__sale') list = list.filter(p => discountPct(p) > 0);
  else if (st.tab !== 'all') list = list.filter(p => (p.style || '') === st.tab);
  return list;
}
function renderStrip(k) {
  const st = state[k], list = itemsFor(k), grid = document.querySelector(`#${k} .grid`);
  grid.classList.toggle('clip', !st.all);
  grid.innerHTML = list.length ? list.map(DQ.card).join('') : `<div class="empty">مفيش منتجات هنا.</div>`;
  document.querySelectorAll(`#${k} .tabs button`).forEach(b => b.classList.toggle('on', b.dataset.tab === st.tab));
  const va = document.querySelector(`#${k} .view-all`);
  va.hidden = list.length <= 4;
  va.querySelector('span').textContent = st.all ? 'عرض أقل' : `عرض الكل (${list.length})`;
  DQ.renderFavs(); DQ.reveal();
}
function build() {
  const live = DQ.liveKinds();
  if (!live.length) { $('#sections').innerHTML = `<div class="none"><div class="m">${RC.logo()}</div>${DQ.loadError ? 'حصلت مشكلة في التحميل. جرّب تعمل ريفريش.' : 'المنتجات جاية قريب.'}</div>`; return; }
  $('#sections').innerHTML = live.map((k, i) => {
    const K = RC.kinds[k], all = DQ.products.filter(p => RC.kindOf(p) === k), img = pick(k, all);
    const rank = s => { const i = K.styles.indexOf(s); return i < 0 ? 99 : i; };
    const styles = [...new Set(all.map(p => p.style).filter(Boolean))].sort((a, b) => rank(a) - rank(b));
    const sale = all.some(p => discountPct(p) > 0);
    state[k] = state[k] || { tab: 'all', all: false };
    return `<section class="kind ${i ? '' : 'section-first'}" id="${k}" aria-label="${K.ar}">
      <div data-glow class="banner op ${img.hero ? 'has-photo op-curtain op-zoom' : 'framed op-curtain'}" ${img.hero ? 'data-parallax' : ''}>${img.hero ? `<div class="bg" style="--img:url('${esc(img.hero)}')"></div>` : ''}
        <div class="wrap ${img.hero ? '' : 'bn-grid'}"><div class="txt op op-stagger">
          <div class="mini-brand"><b>DAQQA</b><small>ACCESSORIES</small></div>
          <h2 class="en" dir="ltr" style="text-align:right">${K.banner.en}</h2>
          <div class="ar">${K.banner.ar}</div>
          <p>${K.banner.sub}</p>
          <a class="btn-line" href="#${k}-shop">${K.banner.cta} ${DQ.ICON.arrow}</a>
        </div>${img.hero ? '' : `<a class="frame op op-arch" href="${RC.productUrl(img.product)}" aria-label="${esc(img.product.name)}"><img src="${esc(img.product.images[0])}" alt="${esc(img.product.name)}"><span class="en">${esc(img.product.name)}</span></a>`}</div></div>
      <div class="strip" data-glow id="${k}-shop"><div class="wrap strip-in">
        <div class="strip-head op op-stagger"><h3 class="en">${K.en}<small>${K.ar}</small></h3><button class="view-all" data-va="${k}"><span>عرض الكل</span> ${DQ.ICON.arrow}</button></div>
        <div class="tabs op op-stagger" role="tablist">
          <button data-tab="all" data-k="${k}" class="on">الكل</button>
          ${styles.map(s => `<button class="en" data-tab="${esc(s)}" data-k="${k}">${esc(s)}</button>`).join('')}
          ${sale ? `<button data-tab="__sale" data-k="${k}">العروض</button>` : ''}
        </div>
        <div class="grid clip"></div>
      </div></div>
      <div data-glow class="band op op-drop ${img.life ? 'has-photo op-zoom' : 'plain'}" ${img.life ? 'data-parallax' : ''}>${img.life ? `<div class="bg" style="--img:url('${esc(img.life)}')"></div>` : `<div class="wm" aria-hidden="true">${RC.logo()}</div>`}
        <div class="wrap"><div class="op op-stagger"><div class="lbl en">DAQQA</div><h2 class="en" dir="ltr" style="text-align:right">${K.band.en}</h2><div class="ar">${K.band.ar}</div></div>
          <div class="feats op op-stagger">${K.band.feats.map(([ic, t]) => `<div>${DQ.ICON[ic]}<span>${t}</span></div>`).join('')}</div></div></div>
    </section>`;
  }).join('');
  live.forEach(renderStrip);
  const h = location.hash.slice(1);
  if (h && document.getElementById(h)) setTimeout(() => document.getElementById(h).scrollIntoView(), 60);
  // product list for Google
  const base = location.origin + location.pathname.replace(/index\.html$/, '');
  const ld = { '@context': 'https://schema.org', '@type': 'ItemList', name: 'DAQQA Collection', itemListElement: DQ.products.map((p, i) => ({ '@type': 'ListItem', position: i + 1, url: base + RC.productUrl(p), name: p.name })) };
  const s = document.createElement('script'); s.type = 'application/ld+json'; s.textContent = JSON.stringify(ld); document.head.appendChild(s);
}
document.addEventListener('click', e => {
  const t = e.target.closest('.tabs [data-tab]');
  if (t) { state[t.dataset.k].tab = t.dataset.tab; renderStrip(t.dataset.k); }
  const v = e.target.closest('[data-va]');
  if (v) { const k = v.dataset.va; state[k].all = !state[k].all; renderStrip(k); }
});
DQ.onRefresh = build;
DQ.start(RC.kinds[location.hash.slice(1)] ? location.hash.slice(1) : 'home', build);
</script>
</body>
</html>
