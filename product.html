<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('dq-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DAQQA</title>
<meta name="description" content="منتج من DAQQA — الدفع عند الاستلام وشحن لكل مصر.">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="theme-color" content="#20160E">
<link rel="canonical" id="canon" href="https://rechargewatches.github.io/Recharge-watches-/product.html">
<meta property="og:type" content="product">
<meta property="og:site_name" content="DAQQA">
<meta property="og:locale" content="ar_EG">
<meta property="og:title" id="ogTitle" content="DAQQA">
<meta property="og:description" id="ogDesc" content="ساعات رجالي وحريمي — الدفع عند الاستلام.">
<meta property="og:image" id="ogImg" content="https://rechargewatches.github.io/Recharge-watches-/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css?v=20261017c">
<link rel="stylesheet" href="assets/store.css?v=20261017c">
<style>
.crumbs{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted-2);padding:22px 0;flex-wrap:wrap}
.crumbs a:hover{color:var(--accent)}
.crumbs .en{color:var(--muted)}
.pd{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:start}
/* gallery */
.gal{position:sticky;top:96px;display:flex;flex-direction:column;gap:12px}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:22px;border:1px solid var(--line);background:radial-gradient(circle at 50% 35%,var(--hero),var(--bg) 78%);scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:1;overflow:hidden;position:relative;cursor:zoom-in}
.slide img{width:100%;height:100%;object-fit:cover;transition:transform .2s ease-out}
.slide.zoom img{transform:scale(1.9)}
.gal .badge-off{position:absolute;top:16px;right:16px;z-index:2;font-size:14px;padding:6px 12px}
.thumbs{display:flex;gap:10px;overflow-x:auto}
.thumbs button{width:76px;height:76px;flex:none;border-radius:14px;overflow:hidden;border:2px solid transparent;opacity:.6;transition:all .2s;background:var(--surface)}
.thumbs button.on{border-color:var(--accent);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
.dots{display:none;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s,width .2s}
.dots i.on{background:var(--accent);width:20px;border-radius:9px}
/* info */
.info{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.info .cat{font-size:13px;color:var(--accent);letter-spacing:.04em}
.info h1{font:400 clamp(34px,4.2vw,54px)/1.08 var(--f-display);color:var(--ink)}
.price-box{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.price-box .price-new{font:700 34px var(--f-ui)}
.price-box .price-old{font-size:20px}
.save-tag{color:var(--green);font-size:14px;font-weight:600;width:100%}
.stock{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.stock i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.stock.low i{background:var(--accent)}
.stock.out i{background:var(--red)}
.lead-d{color:var(--muted);font-size:15px;white-space:pre-line}
.buy{display:grid;grid-template-columns:auto 1fr;gap:10px}
.buy .qty{height:52px;margin:0}
.buy .qty button{width:44px;height:50px}
.buy .btn{height:52px}
.buy .full{grid-column:1/-1}
.side-acts{display:flex;gap:10px;flex-wrap:wrap}
.side-acts .btn{flex:1}
.side-acts svg{width:18px;height:18px;flex:none}
.fav-btn.on{color:var(--accent);border-color:var(--accent)}
.fav-btn.on svg path{fill:currentColor}
.pd-sku{font-size:12px;color:var(--muted-2);letter-spacing:.08em;margin-top:-6px}
.pd-colors{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.pd-colors .sw{margin:0}
.pd-colors .sw i{width:20px;height:20px}
.mini-trust{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini-trust div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.mini-trust svg{width:22px;height:22px;color:var(--accent)}
.mini-trust b{color:var(--ink);font-size:13px}
details{border-bottom:1px solid var(--line)}
details summary{list-style:none;cursor:pointer;padding:18px 0;display:flex;justify-content:space-between;align-items:center;font-weight:600}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font:300 24px var(--f-ui);color:var(--accent);transition:transform .3s}
details[open] summary::after{transform:rotate(45deg)}
details .body{padding:0 0 20px;color:var(--muted);font-size:15px;white-space:pre-line}
.specs{width:100%;border-collapse:collapse;font-size:14px}
.specs td{padding:11px 0;border-bottom:1px dashed var(--line)}
.specs td:first-child{color:var(--muted);width:42%}
.specs td:last-child{color:var(--ink)}
.related{padding-top:96px}
/* sticky bar (mobile) */
.sbar{position:fixed;inset:auto 0 0 0;z-index:60;background:color-mix(in srgb,var(--nav) 96%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px max(10px,env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;transform:translateY(110%);transition:transform .35s}
.sbar.on{transform:none}
.sbar img{width:46px;height:46px;border-radius:10px;object-fit:cover}
.sbar .t{flex:1;min-width:0}
.sbar b{font:500 15px var(--f-display);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .prices .price-new{font-size:14px}
.nf{padding:120px 0;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.nf .m{width:90px;height:93px;opacity:.6}
.sk{border-radius:22px}
@media (max-width:900px){
  .pd{grid-template-columns:1fr;gap:28px}
  .gal{position:static}
  .thumbs{display:none}
  .dots{display:flex}
  .sbar{display:flex}
  .slide{cursor:default}
}
@media (max-width:560px){
  .mini-trust{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .mini-trust div{padding:10px 8px}
  .price-box .price-new{font-size:28px}
  .related{padding-top:64px}
}
</style>
</head>
<body>
<div id="hdr"></div>

<main class="wrap" id="page">
  <div class="crumbs"><span class="skeleton" style="width:220px;height:14px;border-radius:6px"></span></div>
  <div class="pd"><div class="skeleton sk" style="aspect-ratio:1"></div><div style="display:flex;flex-direction:column;gap:14px"><div class="skeleton" style="height:16px;width:30%;border-radius:6px"></div><div class="skeleton" style="height:48px;width:80%;border-radius:8px"></div><div class="skeleton" style="height:40px;width:50%;border-radius:8px"></div><div class="skeleton" style="height:52px;border-radius:999px"></div></div></div>
</main>

<div class="sbar" id="sbar"></div>
<div id="ftr"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js?v=20261017c"></script>
<script src="assets/app.js?v=20261017c"></script>
<script>
const { money, finalPrice, discountPct, esc, categories } = RC;
const $ = s => document.querySelector(s);
const ICONS = {
  ship: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
  cash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>',
  swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/></svg>',
  wa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/><path d="M9 9.5c.3 1.8 1.7 3.3 3.5 4l1-1 2 1v1.5c-3.5.5-7.5-3.5-7-7H10l1 2z"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>'
};
const key = new URLSearchParams(location.search).get('p') || '';
const pid = parseInt(key, 10);
let q = 1;

function notFound() {
  document.title = 'المنتج مش موجود | DAQQA';
  $('#page').innerHTML = `<div class="nf"><div class="m">${RC.logo()}</div><h1 style="font:400 34px var(--f-display)">المنتج ده مش متاح دلوقتي</h1><p style="color:var(--muted)">ممكن يكون اتباع أو اتشال. شوف باقي الكولكشن.</p><a class="btn btn-amber" href="./">كل المنتجات</a></div>`;
}

function render() {
  const p = DQ.byId(pid);
  if (!p) return notFound();
  const off = discountPct(p), imgs = (p.images && p.images.length) ? p.images : [DQ.FALLBACK];
  const { specs, body } = RC.splitDesc(p.description);
  const url = location.origin + location.pathname.replace(/[^/]*$/, '') + RC.productUrl(p);
  // keep the canonical, readable address in the bar
  if (key !== RC.slug(p)) history.replaceState(null, '', RC.productUrl(p));

  // SEO
  const cat = categories[p.category] || '', kind = RC.kindOf(p), K = RC.kinds[kind], noun = RC.noun(p);
  document.title = `${p.name} — ${noun} ${cat} | DAQQA`;
  const desc = `${p.name} من DAQQA بـ ${money(finalPrice(p))}${off ? ` بدل ${money(p.price)} (خصم ${off}%)` : ''}. ${body ? body.slice(0, 110) + ' — ' : ''}الدفع عند الاستلام وشحن لكل مصر.`;
  document.querySelector('meta[name=description]').content = desc;
  $('#canon').href = url; $('#ogTitle').content = `${p.name} | DAQQA`; $('#ogDesc').content = desc;
  if (p.images && p.images[0]) $('#ogImg').content = p.images[0].startsWith('http') ? p.images[0] : new URL(p.images[0], location.href).href;
  const ld = { '@context': 'https://schema.org', '@type': 'Product', name: p.name, image: imgs.filter(u => !u.startsWith('data:')), description: body || desc, sku: RC.sku(p), category: K.en,
    brand: { '@type': 'Brand', name: p.brand && !/recharge/i.test(p.brand) ? p.brand : 'DAQQA' },
    offers: { '@type': 'Offer', url, priceCurrency: 'EGP', price: finalPrice(p), availability: p.stock > 0 ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock', itemCondition: 'https://schema.org/NewCondition' } };
  const s = document.createElement('script'); s.type = 'application/ld+json'; s.textContent = JSON.stringify(ld); document.head.appendChild(s);

  const stockCls = p.stock <= 0 ? 'out' : p.stock <= 3 ? 'low' : '';
  const stockTxt = p.stock <= 0 ? 'نفدت الكمية' : p.stock <= 3 ? `فاضل ${p.stock} بس — اطلب بسرعة` : 'متاح للطلب';
  const waMsg = encodeURIComponent(`أهلاً DAQQA 👋\nعاوز أسأل عن ${noun} ${p.name} (${money(finalPrice(p))})\n${url}`);

  $('#page').innerHTML = `
    <nav class="crumbs" aria-label="مسار الصفحة"><a href="./">الرئيسية</a><span>/</span><a href="./#${kind}">${K.ar}</a><span>/</span><span>${esc(cat)}</span><span>/</span><span class="en">${esc(p.name)}</span></nav>
    <div class="pd">
      <div class="gal">
        <div style="position:relative" class="op op-curtain">
          ${off ? `<span class="badge-off">-${off}%</span>` : ''}
          <div class="slides" id="slides">${imgs.map((u, i) => `<div class="slide"><img src="${esc(u)}" alt="${esc(p.name)} — صورة ${i + 1}" ${i ? 'loading="lazy"' : ''} onerror="this.src='${DQ.FALLBACK}'"></div>`).join('')}</div>
        </div>
        ${imgs.length > 1 ? `<div class="thumbs" id="thumbs">${imgs.map((u, i) => `<button class="${i ? '' : 'on'}" data-i="${i}" aria-label="صورة ${i + 1}"><img src="${esc(u)}" alt=""></button>`).join('')}</div>
        <div class="dots" id="dots">${imgs.map((u, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>` : ''}
      </div>
      <div class="info op op-stagger">
        <span class="cat">${K.ar} · ${esc(cat)}${p.brand && !/recharge/i.test(p.brand) ? ' · <span class="en">' + esc(p.brand) + '</span>' : ''}</span>
        <h1 class="en" dir="ltr" style="text-align:right">${esc(p.name)}</h1>
        <span class="pd-sku en">${RC.sku(p)}${p.style ? ' · ' + esc(p.style) : ''}</span>
        ${RC.colors(p).length ? `<div class="pd-colors"><span>الألوان المتاحة</span><div class="sw">${RC.colors(p).map(c => `<i style="background:${c}"></i>`).join('')}</div></div>` : ''}
        <div class="price-box"><span class="price-new">${money(finalPrice(p))}</span>${off ? `<span class="price-old">${money(p.price)}</span><span class="badge-off">-${off}%</span><span class="save-tag">هتوفّر ${money(p.price - finalPrice(p))}</span>` : ''}</div>
        <div class="stock ${stockCls}"><i></i>${stockTxt}</div>
        ${body ? `<p class="lead-d">${esc(body)}</p>` : ''}
        ${p.stock > 0 ? `<div class="buy" id="buy">
          <div class="qty"><button id="qm" aria-label="تقليل">−</button><span id="qv">1</span><button id="qp" aria-label="زيادة">+</button></div>
          <button class="btn btn-primary" id="addBtn">أضف للسلة</button>
          <button class="btn btn-amber full" id="buyBtn">اطلب دلوقتي · الدفع عند الاستلام</button>
        </div>` : `<a class="btn btn-ghost" href="./#${kind}">شوف ${K.ar} تانية</a>`}
        <div class="side-acts">
          ${DQ.wa() ? `<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="https://wa.me/${DQ.wa()}?text=${waMsg}">${ICONS.wa} اسأل على واتساب</a>` : ''}
          <button class="btn btn-ghost btn-sm fav-btn ${DQ.favs.has(p.id) ? 'on' : ''}" data-fav="${p.id}" aria-pressed="${DQ.favs.has(p.id)}">${DQ.ICON.heart} المفضلة</button>
          <button class="btn btn-ghost btn-sm" id="shareBtn">${ICONS.share} شارك اللينك</button>
        </div>
        <div class="mini-trust">
          <div>${ICONS.cash}<b>كاش عند الاستلام</b>افحص وادفع</div>
          <div>${ICONS.ship}<b>شحن لكل مصر</b>خلال 2–5 أيام</div>
          <div>${ICONS.swap}<b>استبدال</b>خلال 14 يوم</div>
        </div>
        <div>
          ${specs.length ? `<details open><summary>المواصفات</summary><div class="body" style="white-space:normal"><table class="specs">${specs.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table></div></details>` : ''}
          <details ${specs.length ? '' : 'open'}><summary>عن ال${noun}</summary><div class="body">${esc(body || noun + ' مختارة من كولكشن DAQQA، متفحوصة قبل الشحن.')}</div></details>
          <details><summary>الشحن والاستبدال</summary><div class="body">الشحن لكل المحافظات خلال 2–5 أيام عمل${DQ.settings.shipping_fee ? ` بـ ${money(DQ.settings.shipping_fee)}` : ''}${DQ.settings.free_shipping_over ? `، ومجاني للطلبات فوق ${money(DQ.settings.free_shipping_over)}` : ''}.
الدفع كاش عند الاستلام بعد ما تفحص الساعة.
تقدر تستبدل خلال 14 يوم لو ال${noun} بحالتها.</div></details>
        </div>
      </div>
    </div>
    <section class="related" id="related"></section>`;

  // gallery
  const slides = $('#slides');
  const go = i => slides.scrollTo({ left: -i * slides.clientWidth * (getComputedStyle(slides).direction === 'rtl' ? 1 : -1), behavior: 'smooth' });
  if ($('#thumbs')) $('#thumbs').onclick = e => { const b = e.target.closest('[data-i]'); if (b) go(+b.dataset.i); };
  slides.addEventListener('scroll', () => {
    const i = Math.round(Math.abs(slides.scrollLeft) / slides.clientWidth);
    document.querySelectorAll('#thumbs button').forEach((b, k) => b.classList.toggle('on', k === i));
    document.querySelectorAll('#dots i').forEach((b, k) => b.classList.toggle('on', k === i));
  }, { passive: true });
  if (matchMedia('(hover:hover) and (min-width:901px)').matches) slides.querySelectorAll('.slide').forEach(sl => {
    const img = sl.querySelector('img');
    sl.onmousemove = e => { const r = sl.getBoundingClientRect(); img.style.transformOrigin = `${(e.clientX - r.left) / r.width * 100}% ${(e.clientY - r.top) / r.height * 100}%`; };
    sl.onclick = () => sl.classList.toggle('zoom');
    sl.onmouseleave = () => sl.classList.remove('zoom');
  });

  // buy
  if (p.stock > 0) {
    $('#qm').onclick = () => { q = Math.max(1, q - 1); $('#qv').textContent = q; };
    $('#qp').onclick = () => { q = Math.min(p.stock, 20, q + 1); $('#qv').textContent = q; };
    $('#addBtn').onclick = () => DQ.addToCart(p.id, q);
    $('#buyBtn').onclick = () => { DQ.addToCart(p.id, q, true); DQ.openCart('checkout'); };
    const sb = $('#sbar');
    sb.innerHTML = `<img src="${DQ.img(p)}" alt=""><div class="t"><b class="en">${esc(p.name)}</b>${DQ.priceHTML(p)}</div><button class="btn btn-amber btn-sm" id="sbBuy">اطلب دلوقتي</button>`;
    $('#sbBuy').onclick = () => { DQ.addToCart(p.id, 1, true); DQ.openCart('checkout'); };
    new IntersectionObserver(([e]) => sb.classList.toggle('on', !e.isIntersecting && e.boundingClientRect.top < 0)).observe($('#buy'));
  }
  $('#shareBtn').onclick = async () => {
    try { if (navigator.share) { await navigator.share({ title: p.name + ' | DAQQA', url }); return; } } catch (e) { return; }
    try { await navigator.clipboard.writeText(url); DQ.toast('اتنسخ اللينك ✓', 'ok'); } catch (e) { DQ.toast('انسخ اللينك من شريط العنوان', 'err'); }
  };

  // related
  const rel = DQ.products.filter(x => x.id !== p.id).sort((a, b) => ((RC.kindOf(b) === kind) - (RC.kindOf(a) === kind)) || ((b.category === p.category) - (a.category === p.category)) || (b.featured - a.featured)).slice(0, 4);
  if (rel.length) $('#related').innerHTML = `<div class="sec-head"><h2 class="en">You may <em>also like</em><span class="ar">ممكن تعجبك كمان</span></h2><a class="sec-link" href="./#${kind}">كل ال${K.ar} ←</a></div><div class="grid">${rel.map(DQ.card).join('')}</div>`;
  DQ.renderFavs(); DQ.reveal();
}
DQ.onRefresh = () => {};
DQ.start('product', () => { if (!pid || isNaN(pid)) return notFound(); render(); });
</script>
</body>
</html>
