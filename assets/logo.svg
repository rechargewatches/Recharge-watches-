<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="100" cy="100" r="88" stroke-width="2"/>
  <g stroke-width="3">
    <line x1="100" y1="14" x2="100" y2="24"/><line x1="100" y1="176" x2="100" y2="186"/>
    <line x1="14" y1="100" x2="24" y2="100"/><line x1="176" y1="100" x2="186" y2="100"/>
  </g>
  <g stroke-width="1.8">
    <line x1="143" y1="25.5" x2="139" y2="32.4"/><line x1="174.5" y1="57" x2="167.6" y2="61"/>
    <line x1="174.5" y1="143" x2="167.6" y2="139"/><line x1="143" y1="174.5" x2="139" y2="167.6"/>
    <line x1="57" y1="174.5" x2="61" y2="167.6"/><line x1="25.5" y1="143" x2="32.4" y2="139"/>
    <line x1="25.5" y1="57" x2="32.4" y2="61"/><line x1="57" y1="25.5" x2="61" y2="32.4"/>
  </g>
  <!-- R : hour hand at 12 + bowl + leg -->
  <path d="M100 103 V40" stroke-width="5.5"/>
  <path d="M100 40 H111 A15 15 0 0 1 111 70 H100" stroke-width="3"/>
  <path d="M108 70 L134 100" stroke-width="3"/>
  <!-- E : stem + arms, bottom arm = minute hand to 3 -->
  <path d="M134 100 V40 H157 M134 70 H153" stroke-width="3"/>
  <path d="M100 100 H164" stroke-width="4.5"/>
  <path d="M159 95.5 L164.5 100 L159 104.5" stroke-width="3"/>
  <!-- seconds hand -->
  <g class="sec" stroke="#b07a3a" stroke-width="2.2"><line x1="113" y1="92.5" x2="44" y2="132"/></g>
  <circle cx="100" cy="100" r="5" fill="currentColor" stroke="none"/>
  <circle cx="100" cy="100" r="2" fill="#b07a3a" stroke="none"/>
</svg>
